<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="Day4.css">
</head>
<body>
    <nav class="navbar bg-body-tertiary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">
      <img src="https://i.pinimg.com/originals/67/87/ff/6787ff0a80c40ed629967b2833c0e64c.png" alt="Logo" width="30" height="28" class="d-inline-block align-text-top">
      Student Dashboard
    </a>
  </div>
</nav>
<div class="container">
    <h5 class="mb-0 fw-bold"><i class="bi bi-mortaboard-fill me-2"></i>Student Dashboard</h5>
</div>
<div class="container mb-5">
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
        <h6 class="fw-bold mb-0">Daftar Nilai Siswa</h6>
        <div class="search-box">
          <input type="text" id="searchInput" class="form-control form-control-sm" placeholder="Cari nama siswa...">
        </div>
      </div>
      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col" style="width: 50px;">No</th>
              <th scope="col">Nama Siswa</th>
              <th scope="col">Kelas</th>
              <th scope="col" class="text-center">Nilai Siswa</th>
            </tr>
          </thead>
          <tbody id="tableBody">
          </tbody>
        </table>
      </div>
      <div class="d-flex justify-content-end align-items-center mt-3">
        <span class="me-2 small fw-bold">Rata-rata Nilai Kelas</span>
        <span class="badge bg-primary fs-6" id="averageScore">0</span>
      </div>
    </div>
  </div>
</div>
<script src="Day4.js"></script>
</body>
</html>
